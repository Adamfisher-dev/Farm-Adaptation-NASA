# Streamlit settings for Orbital Acre (read when running `streamlit run app/app.py` from the repo root).

[theme]
base = "light"
primaryColor = "#2f6b3a"              # field green: buttons, sliders, selected options
backgroundColor = "#fbf9f4"           # warm off-white page
secondaryBackgroundColor = "#f1eadb"  # sand: inputs and panels
textColor = "#23301f"                 # deep green-black
borderColor = "#e2d6bd"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false         # the app uses its own banner menu, no sidebar
