# Rotation library - read by src/fieldshift/model/rotations.py. Editing this file changes the model.
# Candidates = base_sequences x cover_modifiers.
# ids must match tests/mock_results.json (cs, csw, csorc, csoaa; none, rye_before_soy, rye).
# "+" in a sequence = underseeded crop (crops.py format), e.g. oats+red_clover.
#
# ORDINAL SCORES (0-3) are STARTING VALUES set by the rules under score_rules, each with
# a source for the direction of the effect. They are not measured values: an agronomist
# should review them, and confidence says how solid each is.

# --- What each crop needs from the farm (FarmInputs field names) ----------------------
crop_requires:
  alfalfa: [livestock_or_hay_buyer, hay_equipment]
  oats: [small_grain_buyer]
  winter_wheat: [small_grain_buyer]
  cereal_rye: [can_seed_cover]
  red_clover: []            # sown with the oats: no extra field operation

# Plain reason shown when a rotation is removed because the answer was "no".
requirement_reasons:
  livestock_or_hay_buyer: Needs livestock or a hay buyer
  hay_equipment: Needs hay equipment (own or hired)
  small_grain_buyer: Needs a buyer for oats or wheat within reach
  can_seed_cover: Needs someone to seed a cover crop after harvest

# --- Base sequences ------------------------------------------------------------------
base_sequences:
  - id: cs
    name: Corn–soybean
    sequence: [corn, soybean]
    scores: {n_benefit: 1, pest_break: 1, som_proxy: 0}
    confidence: medium
    marsden: false
    sources: ["Davis et al. 2012, PLOS ONE 7(10): e47149 (Marsden Farm 2-year system)"]
    card:
      why: "Corn and soybean alternate each year - the usual Corn Belt rotation. Corn after soybean needs less nitrogen and yields more than corn after corn."
      benefits: "Two familiar crops with established markets, equipment, insurance and know-how."
      gaps: "It only partly breaks pest cycles: some corn rootworm populations in the Corn Belt have adapted to the corn-soybean rotation (verify the local situation with Iowa State Extension)."
      risks: ""
      risks_if_no_cover: "The soil is bare for about half of every year, from harvest to planting, when spring and autumn storms can wash soil away and nitrate can leave through drainage."
  - id: csw
    name: Corn–soybean–winter wheat
    sequence: [corn, soybean, winter_wheat]
    scores: {n_benefit: 1, pest_break: 2, som_proxy: 1}
    confidence: low
    marsden: false
    sources: ["SARE (2007) Managing Cover Crops Profitably, 3rd ed. (winter small grains as cover) (verify)"]
    card:
      why: "Adds winter wheat after soybean: a third crop, sown in autumn, that covers the soil over winter and is harvested in July."
      benefits: "Living cover through winter and spring, a third crop to break pest and weed cycles, and wheat straw to sell; the July harvest leaves time to sow a cover crop or spread manure."
      gaps: "Iowa grows little winter wheat: there are no official Iowa wheat yields, so yields and prices here come from Illinois, Missouri and Wisconsin, and local buyers may be scarce."
      risks: "Needs a wheat buyer and planting soon after soybean harvest; winter damage and head scab can cut yields in some years (verify with Iowa State Extension)."
  - id: csorc
    name: Corn–soybean–oats with red clover
    sequence: [corn, soybean, "oats+red_clover"]
    scores: {n_benefit: 2, pest_break: 2, som_proxy: 2}
    confidence: medium
    marsden: true
    sources: ["Davis et al. 2012, PLOS ONE 7(10): e47149 (Marsden Farm 3-year system)"]
    card:
      why: "Adds oats sown together with red clover - the 3-year system tested at Iowa State's Marsden Farm. A third crop breaks the corn-soybean pest and weed cycle, and the clover supplies nitrogen to the next corn crop."
      benefits: "In the Marsden Farm trial the 3- and 4-year systems used far less synthetic nitrogen and herbicide than corn-soybean while yields and profits stayed similar."
      gaps: "The Marsden results describe whole farming systems (with less herbicide and, in the longer rotations, manure), not the rotation alone. Oat prices and buyers vary locally, and soil organic matter changes slowly - it is scored from the research literature, not measured."
      risks: "Needs an oat buyer or on-farm use, and the clover can fail to establish in a dry summer."
  - id: csoaa
    name: Corn–soybean–oats/alfalfa–alfalfa (Marsden-type 4-year)
    sequence: [corn, soybean, "oats+alfalfa", alfalfa]
    scores: {n_benefit: 3, pest_break: 3, som_proxy: 3}
    confidence: medium
    marsden: true
    sources: ["Davis et al. 2012, PLOS ONE 7(10): e47149 (Marsden Farm 4-year system)"]
    card:
      why: "The 4-year system tested at Iowa State's Marsden Farm: oats sown together with alfalfa, then a full year of alfalfa hay. Two seasons of perennial cover give the strongest pest and weed break of the options."
      benefits: "Alfalfa keeps living roots in the soil all year and leaves nitrogen for the following corn; in the Marsden Farm trial this system cut fertiliser and herbicide use sharply while profits stayed similar."
      gaps: "The Marsden results describe a whole farming system that also received manure. Hay income depends on local buyers or livestock and on hay quality - the price used is the Iowa average for all qualities."
      risks: "Ties the field to hay for two seasons and needs hay equipment, labour and a buyer or livestock; alfalfa uses a lot of water, so it suffers in a July drought."

# --- Cover-crop modifiers ------------------------------------------------------------
cover_modifiers:
  - id: none
    name: no cover crop
    suffix: ""
    where: none               # none | before_soybean | every_bare_gap
    score_adjust: {}
    card: {}
  - id: rye_before_soy
    name: cereal rye before soybean only
    suffix: " + cereal rye before soybean"
    where: before_soybean
    score_adjust: {som_proxy: 1}
    sources: ["Iowa State University Extension: cereal rye before soybean (verify exact publication)"]
    card:
      why: "Adds a cereal rye cover crop over the winter before soybeans - the lower-risk place for a cover crop, because soybeans are less affected by a rye cover than corn."
      benefits: "Living roots from corn harvest to spring hold the soil and take up nitrogen left after corn, and state cost-share can pay part of the cost."
      gaps: "Soil organic matter builds up slowly over years; the soil-health benefit is scored from the research literature, not measured."
      risks: "The rye has to be terminated before the soybeans are planted, within your crop insurer's rules."

  - id: rye
    name: cereal rye in every bare winter gap
    suffix: " + cereal rye"
    where: every_bare_gap
    score_adjust: {som_proxy: 2}
    sources: ["SARE (2007) Managing Cover Crops Profitably, 3rd ed. (verify)"]
    card:
      why: "Adds a cereal rye cover crop in every bare winter, so the field is almost never left without living cover."
      benefits: "Living roots hold the soil and take up leftover nitrogen through every winter, including the winter before corn, and state cost-share can pay part of the cost."
      gaps: "Soil organic matter builds up slowly over years; the soil-health benefit is scored from the research literature, not measured."
      risks: "Rye before corn can reduce corn yield unless it is terminated about 10-14 days before planting."


cover_crop: cereal_rye

# Card text for a farmer's own rotation that is not in the library (model/cards.py).
existing_card:
  why: "Your current rotation, as grown on this field. Every option is compared with it."
  benefits: "No change to crops, equipment, markets or workload."
  gaps: "This rotation is not in the library, so its nitrogen, pest and soil scores come from general rules (low confidence)."
  risks: ""

# --- How the ordinal scores were set (shown on the evidence page) --------------------
# Same rules score a farmer's own rotation when it is not in the library (confidence low).
score_rules:
  n_benefit:
    meaning: Nitrogen supplied by legumes to the following corn (less fertiliser needed)
    rule: "0 = no legume; 1 = soybean only; 2 = soybean + a forage legume cover (red clover); 3 = a perennial legume (alfalfa) in the rotation"
    sources: ["Iowa State University nitrogen rate guidelines for corn - lower N rate for corn after soybean (verify)",
              "Davis et al. 2012 - synthetic N much lower in the 3- and 4-year systems"]
  pest_break:
    meaning: How well the rotation breaks pest, disease and weed cycles
    rule: "1 = two crops alternating; 2 = three different crops; 3 = four or more years including a perennial. Minus 1 for corn after corn (rootworm)"
    sources: ["Gray et al. 2009, Annual Review of Entomology 54: 303-321 (corn rootworm and rotation) (verify)",
              "Davis et al. 2012 - less herbicide and lower weed biomass in longer rotations"]
  som_proxy:
    meaning: Expected direction of soil organic matter change (slow, years to decades)
    rule: "0 = corn/soybean only; +1 for a small grain (oats, wheat) in the sequence; +1 for an underseeded legume (red clover); 3 = perennial in rotation; cover crops add score_adjust; capped at 3"
    sources: ["SARE (2007) Managing Cover Crops Profitably, 3rd ed. (verify)"]

# --- Flag texts on the cards (the code decides when each applies) ------------------------
flags:
  rye_before_corn: "Cereal rye before corn can reduce corn yield (nitrogen tie-up): terminate about 10-14 days before planting corn - check with Iowa State Extension."
  cover_insurance: "Check cover-crop termination rules with your crop insurer."
  oats_buyer: "Confirm an oat buyer within hauling distance."
  wheat_buyer: "Confirm a wheat buyer within hauling distance."
  alfalfa: "Alfalfa holds the field for two seasons and needs hay equipment, labour and a buyer or livestock."
  marsden: "Marsden Farm results describe whole systems (the longer rotations also received manure and far less herbicide), not rotation length alone."
  not_open: "You said you are not looking to try new crops: shown for comparison only."
